/* Exactly one of these is on screen: the "Unlocking" line while a stored key is tried, or the
   form once we know there is nothing to try. Never both, and never the form first. */
function showForm(){
  document.getElementById('form').hidden=false;
  document.getElementById('wait').hidden=true;
  document.getElementById('u').focus();
}
/* The page may be written exactly once. Two paths can reach it, the stored key and the form,
   and if the second lands after the first the page is written INTO the signed-in document
   instead of replacing it: the login box and the plan side by side. */
let rendered=false;

async function keyFrom(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',
    false,['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:bin(SALT),iterations:ITER,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function unseal(pw){
  const key=await keyFrom(pw);
  /* GCM authenticates, so a wrong password throws here rather than yielding garbage. */
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:bin(PAGE.iv)},key,bin(PAGE.ct));
  return {html:new TextDecoder().decode(buf),key};
}
/* Swap the whole document for the decrypted page. Scripts injected with innerHTML never run,
   so document.write is the mechanism here rather than a shortcut. */
function render(html){
  if(rendered) return;
  rendered=true;
  document.open();document.write(html);document.close();
}
async function enter(){
  const btn=document.getElementById('go'),err=document.getElementById('e');
  const id=document.getElementById('u').value.trim().toLowerCase();
  const pw=document.getElementById('p').value;
  if(!id||!pw){err.textContent='Enter both fields.';return;}
  btn.disabled=true;btn.textContent='Decrypting';err.textContent='';
  try{
    const {html,key}=await unseal(id+':'+pw);
    /* The page fetches the board after it loads, and the board is encrypted too. Hand the
       derived key forward as raw bytes: it cannot be turned back into the password, and it
       lives only in this tab's session. */
    const raw=await crypto.subtle.exportKey('raw',key);
    /* localStorage, not sessionStorage. A session store dies with the tab, so every new tab
       and every browser restart demanded the password again. This is a build plan behind a
       shared password, not a bank: staying signed in on your own machine is the right default.
       Signing out is clearing site data, or the key rotating on the next publication. */
    store.setItem('pa-key',btoa(String.fromCharCode(...new Uint8Array(raw))));
    store.setItem('pa-salt',SALT);
    render(html);
  }catch(e){
    btn.disabled=false;btn.textContent='Enter';
    err.textContent='That login ID and password did not match.';
  }
}
document.getElementById('go').addEventListener('click',enter);
['u','p'].forEach(k=>document.getElementById(k).addEventListener('keydown',e=>{
  if(e.key==='Enter')enter();else document.getElementById('e').textContent='';}));
/* Come back to an already-open session without retyping.
 *
 * DEFERRED UNTIL PARSING IS DONE, WHICH IS THE WHOLE POINT OF THE WRAPPER.
 * document.open() is specified as a no-op while a parser is active, so running this straight
 * from the inline script meant open() did nothing and write() appended the plan to the document
 * instead of replacing it: the sign-in box and the board side by side, under the shell's
 * body{display:flex}. Signing in by hand never showed it, because a click always lands after
 * parsing. Waiting for DOMContentLoaded makes both paths identical. */
const ready = document.readyState==='loading'
  ? new Promise(r=>document.addEventListener('DOMContentLoaded',r,{once:true}))
  : Promise.resolve();
(async()=>{
  await ready;
  const k=store.getItem('pa-key');
  if(!k){showForm();return;}
  /* The form stays hidden until this resolves. Showing it and then snatching it away is what
     invited someone to start typing into a page that was already signing them in. */
  try{
    const key=await crypto.subtle.importKey('raw',bin(k),{name:'AES-GCM'},true,['decrypt']);
    const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:bin(PAGE.iv)},key,bin(PAGE.ct));
    render(new TextDecoder().decode(buf));
  }catch(e){
    store.removeItem('pa-key');                  // stale key, most likely a republished page
    showForm();
  }
})();
})();
</script>
</body></html>
