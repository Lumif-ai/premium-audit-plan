const bin=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

async function keyFrom(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',
    false,['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:bin(SALT),iterations:ITER,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function unseal(pw){
  const key=await keyFrom(pw);
  /* GCM authenticates, so a wrong password throws here rather than yielding garbage. */
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:bin(PAGE.iv)},key,bin(PAGE.ct));
  return {html:new TextDecoder().decode(buf),key};
}
/* Swap the whole document for the decrypted page. Scripts injected with innerHTML never run,
   so document.write is the mechanism here rather than a shortcut. */
function render(html){document.open();document.write(html);document.close();}
async function enter(){
  const btn=document.getElementById('go'),err=document.getElementById('e');
  const id=document.getElementById('u').value.trim().toLowerCase();
  const pw=document.getElementById('p').value;
  if(!id||!pw){err.textContent='Enter both fields.';return;}
  btn.disabled=true;btn.textContent='Decrypting';err.textContent='';
  try{
    const {html,key}=await unseal(id+':'+pw);
    /* The page fetches the board after it loads, and the board is encrypted too. Hand the
       derived key forward as raw bytes: it cannot be turned back into the password, and it
       lives only in this tab's session. */
    const raw=await crypto.subtle.exportKey('raw',key);
    sessionStorage.setItem('pa-key',btoa(String.fromCharCode(...new Uint8Array(raw))));
    sessionStorage.setItem('pa-salt',SALT);
    render(html);
  }catch(e){
    btn.disabled=false;btn.textContent='Enter';
    err.textContent='That login ID and password did not match.';
  }
}
document.getElementById('go').addEventListener('click',enter);
['u','p'].forEach(k=>document.getElementById(k).addEventListener('keydown',e=>{
  if(e.key==='Enter')enter();else document.getElementById('e').textContent='';}));
/* Come back to an already-open session without retyping. */
(async()=>{
  const k=sessionStorage.getItem('pa-key');
  if(!k)return;
  try{
    const key=await crypto.subtle.importKey('raw',bin(k),{name:'AES-GCM'},true,['decrypt']);
    const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:bin(PAGE.iv)},key,bin(PAGE.ct));
    render(new TextDecoder().decode(buf));
  }catch(e){sessionStorage.removeItem('pa-key');}
})();
})();
</script>
